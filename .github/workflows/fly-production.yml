name: Deploy Fly production

on:
  push:
    branches: [landing]
  workflow_dispatch:
    inputs:
      target:
        description: Fly service to deploy
        type: choice
        default: app
        options:
          - app
          - runner
          - all

concurrency:
  group: fly-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check runner changes
        id: runner_changes
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "${after}")"
          else
            changed="$(git diff --name-only "${before}" "${after}")"
          fi

          printf '%s\n' "${changed}"

          if printf '%s\n' "${changed}" | grep -Eq '^(runner/|Dockerfile\.runner|fly\.runner\.toml)$'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy runner
        if: >-
          (github.event_name == 'push' && steps.runner_changes.outputs.changed == 'true') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'runner' || github.event.inputs.target == 'all'))
        run: fly deploy --config fly.runner.toml --app docwriter-runner
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_RUNNER_DEPLOY_TOKEN }}

      - name: Deploy app
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'app' || github.event.inputs.target == 'all'))
        run: fly deploy --config fly.toml --app docwriter-app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_APP_DEPLOY_TOKEN }}
