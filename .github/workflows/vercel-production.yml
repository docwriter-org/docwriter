name: Deploy production

on:
  push:
    branches:
      - landing
  workflow_dispatch:
    inputs:
      fly_target:
        description: Fly service to deploy after Vercel
        type: choice
        default: app
        options:
          - app
          - runner
          - all
          - none

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into landing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/merge-main-into-landing.mjs
          git push origin HEAD:landing

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@54.10.3

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LANDING_DEPLOY: '1'

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Check runner changes
        id: runner_changes
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          after="$(git rev-parse HEAD)"

          if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "${after}")"
          else
            changed="$(git diff --name-only "${before}" "${after}")"
          fi

          printf '%s\n' "${changed}"

          if printf '%s\n' "${changed}" | grep -Eq '^(runner/|Dockerfile\.runner$|fly\.runner\.toml$)'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy Fly runner
        if: >-
          (github.event_name == 'push' && steps.runner_changes.outputs.changed == 'true') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.fly_target == 'runner' || github.event.inputs.fly_target == 'all'))
        run: bash scripts/deploy-fly.sh runner
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_RUNNER_DEPLOY_TOKEN }}

      - name: Deploy Fly app
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.fly_target == 'app' || github.event.inputs.fly_target == 'all'))
        run: bash scripts/deploy-fly.sh app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_APP_DEPLOY_TOKEN }}
