name: Provider e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: provider-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prefer glibc Claude Agent SDK binary
        run: rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl
      - run: npm run check
      - run: npm run test:unit -- --maxWorkers=2

  # One GitHub-hosted runner (container) per provider — fully isolated.
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, openai, codex, cursor, pi]
        include:
          # GLM-5.2 on Together thinks for a minute or more before its first
          # tool call some of the time; the smoke checks that the provider
          # path works, not that Together answers within 90 s.
          - provider: pi
            agent_timeout_ms: 180000
          # The OpenAI API key that these two jobs use has no credits. Run them
          # without blocking the PR, and warn when they fail; they pass again
          # once the account has credits.
          - provider: openai
            optional: true
          - provider: codex
            optional: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prefer glibc Claude Agent SDK binary
        run: rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Provider smoke (${{ matrix.provider }})
        id: smoke
        continue-on-error: ${{ matrix.optional == true }}
        env:
          E2E_PROVIDER: ${{ matrix.provider }}
          E2E_REQUIRE_CREDENTIALS: '1'
          AGENT_TIMEOUT_MS: ${{ matrix.agent_timeout_ms || 90000 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node e2e/run-provider.mjs
      - name: Warn about an optional provider failure
        if: steps.smoke.outcome == 'failure'
        run: echo "::warning title=${{ matrix.provider }} smoke failed::The ${{ matrix.provider }} provider smoke test failed. It does not block this PR. Check the OpenAI API key credits."
