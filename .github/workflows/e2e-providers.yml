name: Provider e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: provider-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prefer glibc Claude Agent SDK binary
        run: rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl
      - run: npm run check

  provider-smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, openai, codex, cursor, pi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prefer glibc Claude Agent SDK binary
        run: rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Provider smoke (${{ matrix.provider }})
        env:
          E2E_PROVIDER: ${{ matrix.provider }}
          E2E_REQUIRE_CREDENTIALS: '1'
          AGENT_TIMEOUT_MS: 180000
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: npm run test:e2e
