# Merge main into landing when the editor CLI changes.
# Pushing landing triggers the Vercel production deploy workflow.
name: Sync landing branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into landing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main landing
          git checkout landing
          git merge origin/main -m "chore: merge main into landing"
          git push origin landing
