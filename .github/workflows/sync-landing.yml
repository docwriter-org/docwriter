# Merge main into landing so the marketing branch stays current.
# Only landing deploys to Vercel; main stays the editor CLI.
name: Sync landing branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-main-into-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main into landing
        run: |
          git fetch origin main landing
          if ! git show-ref --verify --quiet refs/heads/landing; then
            echo "landing branch does not exist yet — skip"
            exit 0
          fi
          git checkout landing
          git merge origin/main -m "chore: merge main into landing"
          git push origin landing
