# Merge main into landing so the marketing branch stays current.
# This workflow lives on the landing branch only (not main).
name: Sync landing branch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-main-into-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main into landing
        run: |
          git fetch origin main landing
          git checkout landing
          git merge origin/main -m "chore: merge main into landing"
          git push origin landing
