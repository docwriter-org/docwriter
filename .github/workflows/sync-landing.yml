# Merge main into landing when the editor CLI changes.
# Pushing landing triggers the Vercel production deploy workflow.
name: Sync landing branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Merge main into landing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout landing
          git checkout origin/main -- scripts/merge-main-into-landing.mjs
          node scripts/merge-main-into-landing.mjs
          git push origin landing
