# Deploy the hosted editor on push to main. Two targets, chosen by the
# repository variable HOSTED_DEPLOY_TARGET: "fly" (deploy/fly) or "ssh"
# (a plain VM provisioned with deploy/machine). Unset means do nothing.
name: Deploy hosted

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosted
  cancel-in-progress: false

jobs:
  fly:
    if: ${{ vars.HOSTED_DEPLOY_TARGET == 'fly' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy
        run: flyctl deploy . --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_APP_DEPLOY_TOKEN }}

  ssh:
    if: ${{ vars.HOSTED_DEPLOY_TARGET == 'ssh' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prefer glibc Claude Agent SDK binary
        run: rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm prune --omit=dev
      - name: Pack release
        run: tar -czf release.tgz build deploy bin package.json node_modules
      - name: Ship and install
        env:
          SSH_KEY: ${{ secrets.HOSTED_SSH_KEY }}
          HOST: ${{ secrets.HOSTED_HOST }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp release.tgz "root@$HOST:/tmp/release-${GITHUB_SHA}.tgz"
          ssh "root@$HOST" "bash -s" < deploy/machine/release.sh "/tmp/release-${GITHUB_SHA}.tgz" "${GITHUB_SHA::12}"
